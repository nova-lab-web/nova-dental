function doctorName(id){const d=state.doctors.find(x=>x.id===id);return d?d.name:'—'}function priceOf(id){const p=state.priceList.find(x=>x.id===id);return p?Number(p.price)||0:0}function paidOf(c){return(c.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0)}function caseTotals(c){const u=(c.items||[]).reduce((s,it)=>s+(Number(it.price)||0)*(Number(it.qty)||1),0);const total=Math.max(0,u-(Number(c.discount)||0));const paid=paidOf(c);return{unitsTotal:u,total,paid,due:Math.max(0,total-paid)}}function fmt(n){return(Number(n)||0).toLocaleString(state.settings.numerals==='ar'?'ar-EG':'en-US',{maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function lastInvoiceFor(doctorId,beforeDate){const list=state.invoices.filter(i=>i.doctorId===doctorId&&(!beforeDate||!i.to||i.to<beforeDate)).slice().sort((a,b)=>String(a.issuedAt).localeCompare(String(b.issuedAt)));return list.length?list[list.length-1]:null}function autoOpeningBalance(doctorId,fromDate){const inv=lastInvoiceFor(doctorId,fromDate);return inv?Number(inv.closingDue)||0:0}function printStatement(){const doctorId=state.searchFilters?.doctorId||'';if(!doctorId){toast('اختر الطبيب أولًا لطباعة كشف الحساب');return}const from=state.searchFilters?.from||'',to=state.searchFilters?.to||'';const cases=state.cases.filter(c=>c.doctorId===doctorId&&(!from||String(c.receiveDate||'')>=from)&&(!to||String(c.receiveDate||'')<=to)).sort((a,b)=>String(a.receiveDate||'').localeCompare(String(b.receiveDate||'')));const rows=[];cases.forEach(c=>{(c.items||[]).forEach(it=>{const type=state.priceList.find(p=>p.id===it.restorationId)?.name||'—';rows.push(`<tr><td>${esc(c.receiveDate||'—')}</td><td>${esc(it.itemName||'—')}</td><td>${esc(type)}</td><td>${esc(it.color||'—')}</td><td>${fmt(it.qty||1)}</td><td>${fmt(it.price)} ج.م</td></tr>`)})});const total=cases.reduce((s,c)=>s+caseTotals(c).total,0);const amounts=[];state.doctorPayments.filter(p=>p.doctorId===doctorId&&(!from||p.date>=from)&&(!to||p.date<=to)).forEach(p=>amounts.push(Number(p.amount||0)));cases.forEach(c=>(c.payments||[]).forEach(p=>{const date=p.date||c.receiveDate||'—';if((!from||date>=from)&&(!to||date<=to))amounts.push(Number(p.amount||0))}));const collected=amounts.reduce((a,b)=>a+b,0);const remaining=Math.max(0,total-collected);const html=`<div class="print-title">كشف حساب — د. ${esc(doctorName(doctorId))}</div><div class="print-sub">${from||'من بداية السجل'} — ${to||'حتى الآن'}</div><table class="print-table"><thead><tr><th>التاريخ</th><th>اسم الحالة</th><th>نوع الحالة</th><th>اللون</th><th>عدد الوحدات</th><th>السعر</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="6">لا توجد بيانات خلال الفترة</td></tr>'}</tbody></table><div class="print-doctor-due">الإجمالي: ${fmt(total)} ج.م</div><div class="print-doctor-due">المدفوع: ${fmt(collected)} ج.م</div><div class="print-doctor-due">المتبقي: ${fmt(remaining)} ج.م</div>`;document.getElementById('print-area').innerHTML=html;setTimeout(()=>window.print(),150)}

function openExport(printNow){const doctorId=state.reportFilters.doctorId;if(!doctorId){toast('اختر الطبيب أولًا');return}if(state.settings.carryoverMode==='manual'){const v=prompt('أدخل الرصيد المرحّل من الفواتير السابقة لهذا الطبيب (اكتب 0 إذا لا يوجد)','0');if(v===null)return;state.reportFilters.openingBalance=Number(v)||0}else{state.reportFilters.openingBalance=autoOpeningBalance(doctorId,state.reportFilters.from)}const w=window.open('','_blank');if(!w){toast('اسمح بفتح النوافذ المنبثقة');return}w.document.open();w.document.write(makeExportHTML());w.document.close();if(printNow){w.onload=()=>setTimeout(()=>w.print(),250)}}async function issueInvoice(){const doctorId=state.reportFilters.doctorId;if(!doctorId){toast('اختر الطبيب أولًا');return}const from=state.reportFilters.from,to=state.reportFilters.to;let opening=0;if(state.settings.carryoverMode==='manual'){const v=prompt('أدخل الرصيد المرحّل من الفواتير السابقة لهذا الطبيب (اكتب 0 إذا لا يوجد)','0');if(v===null)return;opening=Number(v)||0}else{opening=autoOpeningBalance(doctorId,from)}const cases=state.cases.filter(c=>c.doctorId===doctorId&&(!from||c.receiveDate>=from)&&(!to||c.receiveDate<=to));const periodTotal=cases.reduce((s,c)=>s+caseTotals(c).total,0);const amounts=[];state.doctorPayments.filter(p=>p.doctorId===doctorId&&(!from||p.date>=from)&&(!to||p.date<=to)).forEach(p=>amounts.push(Number(p.amount||0)));cases.forEach(c=>(c.payments||[]).forEach(p=>{const date=p.date||c.receiveDate||'—';if((!from||date>=from)&&(!to||date<=to))amounts.push(Number(p.amount||0))}));const periodPaid=amounts.reduce((a,b)=>a+b,0);const closingDue=Math.max(0,opening+periodTotal-periodPaid);state.invoices.push({id:'inv_'+Date.now(),doctorId,from:from||'',to:to||'',issuedAt:new Date().toISOString(),openingBalance:opening,periodTotal,periodPaid,closingDue});await saveKey('invoices',state.invoices);toast('تم حفظ الفاتورة — رصيد '+fmt(closingDue)+' ج.م سيظهر تلقائيًا في الفاتورة القادمة')}

function casesTab(){if(state.caseView==='form')return caseForm();if(state.statementDoctorId)return statementTab();const _twoDaysAgo=new Date(Date.now()-2*24*60*60*1000).toISOString().slice(0,10);let list=state.cases.filter(c=>(c.receiveDate||'')>=_twoDaysAgo).sort((a,b)=>b.createdAt-a.createdAt);let total=state.cases.reduce((s,c)=>s+caseTotals(c).total,0),casePaid=state.cases.reduce((s,c)=>s+caseTotals(c).paid,0),doctorPaid=state.doctorPayments.reduce((s,p)=>s+Number(p.amount||0),0),due=Math.max(0,total-casePaid-doctorPaid);return`<div class="panel"><button class="btn btn-primary" id="open-statement-picker">${icon('search')} البحث عن حالة</button>${state.statementPickerOpen?`<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>اختر الطبيب</th></tr></thead><tbody>${state.doctors.length?state.doctors.map(d=>`<tr><td data-pick-statement="${d.id}" style="cursor:pointer">${esc(d.name)}</td></tr>`).join(''):'<tr class="empty-row"><td>لا يوجد أطباء مسجلين</td></tr>'}</tbody></table></div>`:''}</div><div class="stat-lines"><div class="stat-line"><span>عدد الحالات</span><b>${state.cases.length}</b></div><div class="stat-line"><span>إجمالي المستحقات</span><b>${fmt(total)} ج.م</b></div><div class="stat-line"><span>المتبقي غير المحصل</span><b style="color:var(--danger)">${fmt(due)} ج.م</b></div></div><div class="panel"><div class="panel-head"><button class="btn btn-primary" id="new-case">${icon('plus')} حالة جديدة</button><div><h2>سجل الحالات</h2><div class="sub">آخر يومين — استخدم "البحث عن حالة" للحالات الأقدم</div></div></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>اسم الحالة</th><th>نوع الحالة</th><th>الكمية</th><th>اللون</th><th>سعر الوحدة</th><th>الإجمالي</th><th></th></tr></thead><tbody>${list.length?list.map(c=>(c.items&&c.items.length?c.items:[{}]).map((i,idx)=>{const type=state.priceList.find(p=>p.id===i.restorationId)?.name||'—';const lineTotal=(Number(i.qty)||0)*(Number(i.price)||0);return `<tr><td>${idx===0?(c.receiveDate||'—' function incompleteCaseWarning(){

  if(!state.settings.pin){toast('بيانات الحالة ناقصة — أكمل البيانات واحفظ الحالة');return false;}

    toast('تم السماح لك بالمتابعة — أكمل البيانات الناقصة ثم احفظ الحالة');

}

let kbTarget=null;
function customKeyboardHTML(){const lang=state.kbLang||'ar';const arDigits=['١','٢','٣','٤','٥','٦','٧','٨','٩','٠'];const enDigits=['1','2','3','4','5','6','7','8','9','0'];const digits=lang==='ar'?arDigits:enDigits;const arRows=[['ض','ص','ث','ق','ف','غ','ع','ه','خ','ح','ج'],['ش','س','ي','ب','ل','ا','ت','ن','م','ك','ط'],['ئ','ء','ؤ','ر','ى','ة','و','ز','ظ','ذ']];const enRows=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']];const rows=[digits,...(lang==='ar'?arRows:enRows)];const rowsHTML=rows.map(r=>`<div class="custom-kb-row">${r.map(ch=>`<button type="button" class="custom-kb-key" data-kb-char="${ch}">${ch}</button>`).join('')}</div>`).join('');return `<div class="custom-kb-top"><button type="button" class="custom-kb-key" style="flex:none;width:56px" id="kb-lang-toggle">${lang==='ar'?'EN':'ع'}</button><button type="button" class="custom-kb-key action" style="flex:none;width:64px" id="kb-done">تم</button></div>${rowsHTML}<div class="custom-kb-row"><button type="button" class="custom-kb-key wide" data-kb-char=" ">مسافة</button><button type="button" class="custom-kb-key" id="kb-backspace">⌫</button></div>`}
function ensureKeyboardEl(){let el=document.getElementById('custom-kb');if(!el){el=document.createElement('div');el.id='custom-kb';el.className='custom-kb';document.body.appendChild(el)}return el}
function insertAtCursor(input,text){const start=input.selectionStart??input.value.length,end=input.selectionEnd??input.value.length;input.value=input.value.slice(0,start)+text+input.value.slice(end);const pos=start+text.length;input.setSelectionRange(pos,pos);input.dispatchEvent(new Event('input',{bubbles:true}))}
function wireKeyboard(){const el=document.getElementById('custom-kb');if(!el)return;el.querySelectorAll('[data-kb-char]').forEach(b=>{b.onclick=()=>{if(kbTarget){insertAtCursor(kbTarget,b.dataset.kbChar);kbTarget.focus()}}});const bs=document.getElementById('kb-backspace');if(bs)bs.onclick=()=>{if(!kbTarget)return;const start=kbTarget.selectionStart??kbTarget.value.length,end=kbTarget.selectionEnd??kbTarget.value.length;if(start===end&&start>0){kbTarget.value=kbTarget.value.slice(0,start-1)+kbTarget.value.slice(start);kbTarget.setSelectionRange(start-1,start-1)}else{kbTarget.value=kbTarget.value.slice(0,start)+kbTarget.value.slice(end);kbTarget.setSelectionRange(start,start)}kbTarget.dispatchEvent(new Event('input',{bubbles:true}));kbTarget.focus()};const lt=document.getElementById('kb-lang-toggle');if(lt)lt.onclick=()=>{state.kbLang=state.kbLang==='ar'?'en':'ar';showKeyboard();if(kbTarget)kbTarget.focus()};const done=document.getElementById('kb-done');if(done)done.onclick=()=>{hideKeyboard();if(kbTarget){kbTarget.blur()}kbTarget=null}}
function showKeyboard(){if(!state.settings||!state.settings.customKeyboard)return;const el=ensureKeyboardEl();el.innerHTML=customKeyboardHTML();el.classList.add('show');wireKeyboard()}
function hideKeyboard(){const el=document.getElementById('custom-kb');if(el)el.classList.remove('show')}
document.addEventListener('focusin',e=>{const t=e.target;if(!state.settings||!state.settings.customKeyboard)return;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')){const excludedTypes=['number','date','password'];const isNumeric=t.getAttribute('inputmode')==='numeric';const excludedIds=['askpin-input','lock-pin'];if(!excludedTypes.includes(t.type)&&!isNumeric&&!excludedIds.includes(t.id)){kbTarget=t;try{t.setAttribute('inputmode','none')}catch(e){}showKeyboard()}}});
document.addEventListener('focusout',e=>{setTimeout(()=>{const ae=document.activeElement;if(ae&&ae.closest&&ae.closest('#custom-kb'))return;if(!ae||(ae.tagName!=='INPUT'&&ae.tagName!=='TEXTAREA')){hideKeyboard()}},80)});

<script id="nova-calculator-v7-js">
(function(){
  function initCalculator(root){
    if(!root || root.dataset.calcReady) return;
    root.dataset.calcReady="1";
    const display=root.querySelector(".calc-display");
    if(!display) return;
    let expr="";
    const paint=()=>display.value=expr||"0";
    root.addEventListener("click",e=>{
      const b=e.target.closest("[data-calc]");
      if(!b) return;
      const v=b.dataset.calc;
      if(v==="C"){expr="";paint();return}
      if(v==="back"){expr=expr.slice(0,-1);paint();return}
      if(v==="="){
        try{
          if(!/^[0-9+\-*/().%\s]+$/.test(expr)) throw 0;
          let s=expr.replace(/%/g,"/100");
          let result=Function('"use strict";return ('+s+')')();
          if(!Number.isFinite(result)) throw 0;
          expr=String(Math.round(result*100000000)/100000000);
        }catch{expr="خطأ"}
        paint(); return;
      }
      if(expr==="خطأ") expr="";
      expr += v;
      paint();
    });
    paint();
  }
  window.initNovaCalculator=initCalculator;
  document.querySelectorAll(".calculator-panel").forEach(initCalculator);
})();
</script>
