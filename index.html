  #app{max-width:1200px;margin:0 auto;padding:16px 16px calc(88px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:42px;height:42px;border-radius:11px;background:#F7EEDD;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #EAD8B4;object-fit:cover}.brand-mark svg{width:42px;height:42px}.brand-text h1{font-size:17px;font-weight:800;margin:0;line-height:1.2;letter-spacing:.3px}.brand-text span{font-size:11.5px;color:var(--muted)}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:500;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:stretch;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(122,21,25,.08)}
  .nav-toggle-btn{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom));left:14px;z-index:501;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(122,21,25,.3);cursor:pointer}
  .nav-toggle-btn svg{width:18px;height:18px}
  body.nav-hidden .bottom-nav{display:none}
  body.nav-hidden .nav-toggle-btn{bottom:calc(14px + env(safe-area-inset-bottom))}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;color:var(--muted);padding:6px 2px;border-radius:9px;font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer}.nav-btn svg{width:20px;height:20px}.nav-btn.active{color:var(--brand)}.nav-btn.active .nav-icon-wrap{background:var(--brand-tint)}.nav-icon-wrap{width:38px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .panel{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}.panel-head h2{font-size:16px;font-weight:800;margin:0}.panel-head .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 15px;border-radius:8px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s}.btn svg{width:15px;height:15px;flex-shrink:0}.btn:hover{border-color:var(--brand);color:var(--brand-dark)}.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}.btn-danger{color:var(--danger);border-color:var(--danger-tint)}.btn-danger:hover{background:var(--danger-tint);border-color:var(--danger)}.btn-ghost{border-color:transparent;background:transparent}.btn-ghost:hover{background:var(--line-2)}.btn-sm{padding:6px 10px;font-size:12.5px}.btn-icon{padding:8px}.btn:disabled{opacity:.4;cursor:not-allowed}

ype="checkbox" id="show-discount-invoice" ${c.showDiscountInInvoice?'checked':''}> إظهار الخصم في الفاتورة</label></div><div class="field"><label>ملاحظات</label><input id="notes" value="${esc(c.notes)}"></div></div><div class="field"><label>المدفوع</label><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>طريقة الدفع</th><th></th></tr></thead><tbody>${c.payments.length?c.payments.map(p=>`<tr><td><input type="date" data-p="date" data-pid="${p.id}" value="${p.date||''}"></td><td><input type="number" min="0" data-p="amount" data-pid="${p.id}" value="${p.amount||0}"></td><td><select data-p="method" data-pid="${p.id}"><option value="">اختر</option><option value="فودافون كاش" ${p.method==='فودافون كاش'?'selected':''}>فودافون كاش</option><option value="نقدي" ${p.method==='نقدي'?'selected':''}>نقدي</option><option value="انستاباي" ${p.method==='انستاباي'?'selected':''}>انستاباي</option><option value="أخرى" ${p.method==='أخرى'?'selected':''}>أخرى</option></select></td><td><button class="btn btn-ghost btn-sm btn-danger" data-rem-pay="${p.id}">${icon('trash')}</button></td></tr>`).join(''):'<tr class="empty-row"><td colspan="4">لا يوجد مدفوع</td></tr>'}</tbody></table></div><button class="btn btn-sm" id="add-pay" style="margin-top:8px">${icon('plus')} إضافة المدفوع</button> <button class="btn btn-primary btn-sm" id="save-case-inline" style="margin-top:8px">${icon('save')} حفظ</button></div><div class="totals-bar"><div class="total-chip paid"><div class="l">المدفوع</div><div class="v">${fmt(t.paid)}</div></div></div></div>`}

function doctorsTabBase(){if(state.doctorDetailId)return doctorDetail();return`<div class="panel"><div class="panel-head"><h2>${state.editingDoctorId?'تعديل طبيب':'الأطباء'}</h2></div><div class="grid-3"><div class="field"><label>اسم الطبيب</label><input id="doc-name" placeholder="مثال: د. أحمد سامي" value="${state.editingDoctorId?esc((state.doctors.find(d=>d.id===state.editingDoctorId)||{}).name||''):''}"></div><div class="field"><label>رقم الهاتف</label><input id="doc-phone" value="${state.editingDoctorId?esc((state.doctors.find(d=>d.id===state.editingDoctorId)||{}).phone||''):''}"></div><button class="btn btn-primary" id="${state.editingDoctorId?'save-doc-edit':'add-doc'}" style="align-self:end;margin-bottom:12px">${icon('save')} ${state.editingDoctorId?'حفظ التعديل':'إضافة طبيب'}</button></div>${state.editingDoctorId?'<button class="btn btn-ghost btn-sm" id="cancel-doc-edit">إلغاء</button>':''}<button class="btn" id="toggle-doctors-list" style="margin-top:10px">${icon('list')} قائمة الأطباء</button></div>${state.showDoctorsList?`<div class="panel"><div class="table-wrap"><table><thead><tr><th>اسم الطبيب</th><th></th></tr></thead><tbody>${state.doctors.length?state.doctors.map(d=>`<tr><td data-detail="${d.id}" style="cursor:pointer">${esc(d.name)}</td><td><button class="btn btn-ghost btn-sm" data-edit-doc="${d.id}">${icon('edit')}</button><button class="btn btn-ghost btn-sm btn-danger" data-del-doc="${d.id}">${icon('trash')}</button></td></tr>`).join(''):'<tr class="empty-row"><td colspan="2">لا يوجد أطباء مسجلين بعد</td></tr>'}</tbody></table></div></div>`:''}${accountsTab()}`}
function doctorDetail(){
let d=state.doctors.find(x=>x.id===state.doctorDetailId);if(!d){state.doctorDetailId=null;return doctorsTabBase()}
const v=state.doctorView||{show:'both',range:'all',from:'',to:''};
const rf=(v.range==='period'&&v.from)?v.from:'',rt=(v.range==='period'&&v.to)?v.to:'',period=!!(rf||rt);
const inR=x=>(!rf||String(x||'')>=rf)&&(!rt||String(x||'')<=rt);
const showCases=v.show!=='payments',showPays=v.show!=='cases';
const docCases=state.cases.filter(c=>c.doctorId===d.id);
let cs=docCases.filter(c=>inR(c.receiveDate)).sort((a,b)=>String(a.receiveDate||'').localeCompare(String(b.receiveDate||'')));
const dps=state.doctorPayments.filter(p=>p.doctorId===d.id&&inR(p.date));
const payRows=[];
dps.forEach(p=>payRows.push({kind:'doctor',id:p.id,date:p.date||'',amount:Number(p.amount||0),note:p.note||''}));
docCases.forEach(c=>(c.payments||[]).forEach(p=>{const dt=p.date||c.receiveDate||'';if(inR(dt))payRows.push({kind:'case',id:c.id,date:dt,amount:Number(p.amount||0),note:'مدفوع للحالة'+(p.method?' — '+p.method:'')})}));
payRows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
let total=cs.reduce((s,c)=>s+caseTotals(c).total,0);
let paid=period?payRows.reduce((s,p)=>s+p.amount,0):(cs.reduce((s,c)=>s+caseTotals(c).paid,0)+dps.reduce((s,p)=>s+Number(p.amount||0),0));
let due=Math.max(0,total-paid);
const showLabel=v.show==='cases'?'الحالات':v.show==='payments'?'المدفوعات':'الحالات والمدفوعات';
const rangeLabel=period?('من '+(rf||'البداية')+' إلى '+(rt||'اليوم')):'كل الفترات';
const paysHTML=showPays?`<div class="panel"><h3>سجل المدفوع</h3><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>ملاحظة</th><th></th></tr></thead><tbody>${payRows.length?payRows.map(p=>`<tr><td>${esc(p.date||'—')}</td><td>${fmt(p.amount)} ج.م</td><td>${esc(p.note||'')}</td><td>${p.kind==='doctor'?`<button class="btn btn-ghost btn-sm" data-edit-doctor-pay="${p.id}">${icon('edit')}</button><button class="btn btn-ghost btn-sm btn-danger" data-del-doctor-pay="${p.id}">${icon('trash')}</button>`:`<button class="btn btn-ghost btn-sm" data-edit="${p.id}">${icon('edit')}</button>`}</td></tr>`).join(''):'<tr class="empty-row"><td colspan="4">لا يوجد مدفوع في هذه الفترة</td></tr>'}</tbody></table></div></div>`:'';
const casesHTML=showCases?`<div class="panel"><h3>الحالات</h3><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>اسم الحالة</th><th>نوع الحالة</th><th>الكمية</th><th>اللون</th><th>سعر الوحدة</th><th>الإجمالي</th><th></th></tr></thead><tbody>${cs.length?cs.map(c=>(c.items&&c.items.length?c.items:[{}]).map((i,idx)=>{const type=state.priceList.find(p=>p.id===i.restorationId)?.name||'—';const lineTotal=(Number(i.qty)||0)*(Number(i.price)||0);return `<tr><td>${idx===0?(c.receiveDate||'—'):''}</td><td>${esc(i.itemName||'—')}</td><td>${esc(type)}</td><td>${fmt(i.qty||1)}</td><td>${esc(i.color||'—')}</td><td>${fmt(i.price||0)} ج.م</td><td>${fmt(lineTotal)} ج.م</td><td>${idx===0?`<button class="btn btn-ghost btn-sm" data-edit="${c.id}">${icon('edit')}</button><button class="btn btn-ghost btn-sm btn-danger" data-del="${c.id}">${icon('trash')}</button>`:''}</td></tr>`}).join('')).join(''):'<tr class="empty-row"><td colspan="8">لا توجد حالات في هذه الفترة</td></tr>'}</tbody></table></div></div>`:'';
return`<div class="panel"><div class="panel-head"><button class="btn btn-ghost btn-sm" id="back-doc">${icon('back')} رجوع</button><h2>${esc(d.name)}</h2><button class="btn btn-ghost btn-sm" data-edit-doc="${d.id}">${icon('edit')} تعديل</button></div><div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px"><div class="sub">العرض: <b>${showLabel}</b> — الفترة: <b>${esc(rangeLabel)}</b></div><button class="btn btn-sm" id="dc-change">تغيير العرض</button></div><div class="stat-cards"><div class="stat-card"><div class="l">الإجمالي</div><div class="v">${fmt(total)} ج.م</div></div><div class="stat-card"><div class="l">المدفوع</div><div class="v" style="color:var(--ok)">${fmt(paid)} ج.م</div></div><div class="stat-card"><div class="l">المتبقي</div><div class="v" style="color:var(--danger)">${fmt(due)} ج.م</div></div></div>${paysHTML}${casesHTML}</div>${accountsTab()}`}
function doctorChooserHTML(){
const id=state.doctorChooserId;if(!id)return'';
const d=state.doctors.find(x=>x.id===id);if(!d){state.doctorChooserId=null;return''}
const c=state.doctorChoice||(state.doctorChoice={show:'both',range:'all',from:'',to:''});
const seg=(attr,val,cur,label)=>`<button type="button" class="btn ${cur===val?'btn-primary':''}" ${attr}="${val}" style="flex:1;padding:14px 6px;font-size:15px">${label}</button>`;
return`<div id="dc-backdrop" style="position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px"><div class="panel" style="width:min(94vw,460px);max-height:92vh;overflow:auto;margin:0"><h2 style="margin:0 0 14px">${esc(d.name)}</h2><div class="field"><label>تعرض إيه؟</label><div style="display:flex;gap:8px">${seg('data-dc-show','cases',c.show,'الحالات')}${seg('data-dc-show','payments',c.show,'المدفوعات')}${seg('data-dc-show','both',c.show,'كليهما')}</div></div><div class="field"><label>الفترة</label><div style="display:flex;gap:8px">${seg('data-dc-range','all',c.range,'عام (كل الفترات)')}${seg('data-dc-range','period',c.range,'فترة زمنية')}</div></div>${c.range==='period'?`<div class="grid-2"><div class="field"><label>من</label><input type="date" id="dc-from" value="${esc(c.from||'')}"></div><div class="field"><label>إلى</label><input type="date" id="dc-to" value="${esc(c.to||'')}"></div></div>`:''}<div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="btn btn-primary" id="dc-go" style="flex:2;padding:15px;font-size:16px">عرض</button><button type="button" class="btn" id="dc-cancel" style="flex:1;padding:15px">إلغاء</button></div></div></div>`}

function statementTab(){const d=state.doctors.find(x=>x.id===state.statementDoctorId);if(!d){state.statementDoctorId=null;return casesTab()}const q=(state.statementSearch||'').trim().toLowerCase();const rows=[];state.cases.filter(c=>c.doctorId===d.id).forEach(c=>{(c.items||[]).forEach((it,idx)=>{const matchesName=(it.itemName||'').toLowerCase().includes(q),matchesDate=(c.receiveDate||'').toLowerCase().includes(q);if(q&&!matchesName&&!matchesDate)return;rows.push({caseId:c.id,itemIndex:idx,date:c.receiveDate||'',item:it})})});rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));const rowsHTML=rows.map(r=>`<tr><td><input type="date" data-stmt-case="${r.caseId}" data-stmt-field="receiveDate" value="${esc(r.date)}"></td><td><input data-stmt-case="${r.caseId}" data-stmt-item="${r.itemIndex}" data-stmt-field="itemName" value="${esc(r.item.itemName||'')}"></td><td><select data-stmt-case="${r.caseId}" data-stmt-item="${r.itemIndex}" data-stmt-field="restorationId">${state.priceList.map(p=>`<option value="${p.id}" ${p.id===r.item.restorationId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></td><td><input type="number" min="0" data-stmt-case="${r.caseId}" data-stmt-item="${r.itemIndex}" data-stmt-field="qty" value="${r.item.qty||1}"></td><td><input data-stmt-case="${r.caseId}" data-stmt-item="${r.itemIndex}" data-stmt-field="color" value="${esc(r.item.color||'')}"></td><td><input type="number" min="0" step="0.01" data-stmt-case="${r.caseId}" data-stmt-item="${r.itemIndex}" data-stmt-field="price" value="${r.item.price||0}"></td><td><button class="btn btn-ghost btn-sm" data-edit="${r.caseId}">${icon('edit')}</button><button class="btn btn-ghost btn-sm btn-danger" data-stmt-del-case="${r.caseId}" data-stmt-del-item="${r.itemIndex}">${icon('trash')}</button></td></tr>`).join('')||'<tr class="empty-row"><td colspan="7">لا توجد نتائج</td></tr>';return`<div class="panel"><div class="panel-head"><button class="btn btn-ghost btn-sm" id="back-statement">${icon('back')} رجوع</button><h2>كشف حساب — ${esc(d.name)}</h2></div><div class="field"><label>بحث باسم الحالة أو التاريخ</label><div style="display:flex;gap:8px;align-items:center;position:relative"><input id="statement-search" style="flex:1" placeholder="اكتب اسم الحالة أو التاريخ للبحث" value="${esc(state.statementSearch||'')}"><button type="button" class="btn" id="statement-date-btn" title="اختيار تاريخ" style="padding:9px 13px;font-size:20px;line-height:1">📅</button>${q?'<button type="button" class="btn" id="statement-clear" title="مسح البحث" style="padding:9px 13px;font-size:18px;line-height:1">✕</button>':''}<input type="date" id="statement-date" tabindex="-1" aria-hidden="true" style="position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none"></div></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>اسم الحالة</th><th>نوع الحالة</th><th>الكمية</th><th>اللون</th><th>سعر الوحدة</th><th></th></tr></thead><tbody>${rowsHTML}</tbody></table></div></div>`}function doctorsAccountsTab(){return doctorsTab()}
const PRICE_CATS=[['fixed','ثابت'],['removable','متحرك'],['ortho','تقويم'],['other','أخرى']];
function priceCat(p){return PRICE_CATS.some(c=>c[0]===p.category)?p.category:'other'}
function priceCatLabel(p){return (PRICE_CATS.find(c=>c[0]===priceCat(p))||[])[1]||'أخرى'}
function priceOptionsGrouped(sel){return PRICE_CATS.map(c=>{const L=state.priceList.filter(p=>priceCat(p)===c[0]);return L.length?`<optgroup label="${c[1]}">${L.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup>`:''}).join('')}
function chooseModal(title,options,opts){opts=opts||{};return new Promise(resolve=>{const ov=document.createElement('div');ov.style.cssText='position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);z-index:3000;display:flex;align-items:center;justify-content:center;padding:16px';const card=document.createElement('div');card.className='panel';card.dir='rtl';card.style.cssText='width:min(94vw,440px);max-height:88vh;overflow:auto;margin:0';let html='<h2 style="margin:0 0 12px;font-size:18px">'+esc(title)+'</h2>';html+=options.length?options.map((o,i)=>'<button type="button" class="btn" data-ci="'+i+'" style="display:block;width:100%;margin:0 0 8px;padding:15px 12px;font-size:16px;text-align:right">'+esc(o.label)+'</button>').join(''):'<div class="empty-state" style="margin-bottom:10px">'+esc(opts.empty||'لا توجد خيارات')+'</div>';html+='<div style="display:flex;gap:8px;margin-top:6px">'+(opts.back?'<button type="button" class="btn" data-cx="back" style="flex:1;padding:13px">رجوع</button>':'')+'<button type="button" class="btn btn-ghost" data-cx="cancel" style="flex:1;padding:13px">إلغاء</button></div>';card.innerHTML=html;ov.appendChild(card);document.body.appendChild(ov);const done=v=>{if(ov.parentNode)ov.parentNode.removeChild(ov);resolve(v)};card.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>done(options[Number(b.dataset.ci)].value));card.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>done(b.dataset.cx==='back'?'__back__':null));ov.onclick=e=>{if(e.target===ov)done(null)}})}
async function pickItemType(allowNew){const cnt=k=>state.priceList.filter(p=>priceCat(p)===k).length;while(true){const catOpts=PRICE_CATS.map(c=>({value:c[0],label:c[1]+'  ('+cnt(c[0])+')'}));if(allowNew)catOpts.push({value:'__new__',label:'➕ نوع جديد'});const cat=await chooseModal('اختر القسم',catOpts);if(!cat)return null;if(cat==='__new__')return cat;const label=(PRICE_CATS.find(c=>c[0]===cat)||[])[1]||'';const list=state.priceList.filter(p=>priceCat(p)===cat);const t=await chooseModal(label,list.map(p=>({value:p.id,label:p.name+' — '+fmt(p.price||0)+' ج.م'})),{back:true,empty:'لا توجد أنواع في هذا القسم. حدّد قسم الأنواع من صفحة الأسعار.'});if(t==='__back__')continue;return t}}

function incompleteCaseWarning(){

}

function customKeyboardHTML(){const lang=state.kbLang||'ar';const arDigits=['١','٢','٣','٤','٥','٦','٧','٨','٩','٠'];const enDigits=['1','2','3','4','5','6','7','8','9','0'];const digits=lang==='ar'?arDigits:enDigits;const arRows=[['ض','ص','ث','ق','ف','غ','ع','ه','خ','ح','ج'],['ش','س','ي','ب','ل','ا','ت','ن','م','ك','ط'],['ئ','ء','ؤ','ر','ى','ة','و','ز','ظ','ذ']];const enRows=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']];const rows=[digits,...(lang==='ar'?arRows:enRows)];const rowsHTML=rows.map(r=>`<div class="custom-kb-row">${r.map(ch=>`<button type="button" class="custom-kb-key" data-kb-char="${ch}">${ch}</button>`).join('')}</div>`).join('');return `<div class="custom-kb-top"><button type="button" class="custom-kb-key" style="flex:none;width:56px" id="kb-lang-toggle">${lang==='ar'?'EN':'ع'}</button><button type="button" class="custom-kb-key action" style="flex:none;width:64px" id="kb-done">تم</button></div>${rowsHTML}<div class="custom-kb-row"><button type="button" class="custom-kb-key wide" data-kb-char=" ">مسافة</button><button type="button" class="custom-kb-key" id="kb-backspace">⌫</button></div>`}

function insertAtCursor(input,text){const start=input.selectionStart??input.value.length,end=input.selectionEnd??input.value.length;input.value=input.value.slice(0,start)+text+input.value.slice(end);const pos=start+text.length;input.setSelectionRange(pos,pos);input.dispatchEvent(new Event('input',{bubbles:true}))}

<script id="nova-calculator-v7-js">
(function(){
  function initCalculator(root){
    if(!root || root.dataset.calcReady) return;
    root.dataset.calcReady="1";
    const display=root.querySelector(".calc-display");
    if(!display) return;
    let expr="";
    const paint=()=>display.value=expr||"0";
    root.addEventListener("click",e=>{
      const b=e.target.closest("[data-calc]");
      if(!b) return;
      const v=b.dataset.calc;
      if(v==="C"){expr="";paint();return}
      if(v==="back"){expr=expr.slice(0,-1);paint();return}
      if(v==="="){
        try{
          if(!/^[0-9+\-*/().%\s]+$/.test(expr)) throw 0;
          let s=expr.replace(/%/g,"/100");
          let result=Function('"use strict";return ('+s+')')();
          if(!Number.isFinite(result)) throw 0;
          expr=String(Math.round(result*100000000)/100000000);
        }catch{expr="خطأ"}
        paint(); return;
      }
      if(expr==="خطأ") expr="";
      expr += v;
      paint();
    });
    paint();
  }
  window.initNovaCalculator=initCalculator;
  document.querySelectorAll(".calculator-panel").forEach(initCalculator);
})();
</script>
