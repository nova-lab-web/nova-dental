  #app{max-width:1200px;margin:0 auto;padding:16px 16px calc(88px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:42px;height:42px;border-radius:11px;background:#F7EEDD;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #EAD8B4;object-fit:cover}.brand-mark svg{width:42px;height:42px}.brand-text h1{font-size:17px;font-weight:800;margin:0;line-height:1.2;letter-spacing:.3px}.brand-text span{font-size:11.5px;color:var(--muted)}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:500;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:stretch;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(122,21,25,.08)}
  .nav-toggle-btn{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom));left:14px;z-index:501;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(122,21,25,.3);cursor:pointer}
  .nav-toggle-btn svg{width:18px;height:18px}
  body.nav-hidden .bottom-nav{display:none}
  body.nav-hidden .nav-toggle-btn{bottom:calc(14px + env(safe-area-inset-bottom))}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;color:var(--muted);padding:6px 2px;border-radius:9px;font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer}.nav-btn svg{width:20px;height:20px}.nav-btn.active{color:var(--brand)}.nav-btn.active .nav-icon-wrap{background:var(--brand-tint)}.nav-icon-wrap{width:38px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .panel{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}.panel-head h2{font-size:16px;font-weight:800;margin:0}.panel-head .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 15px;border-radius:8px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s}.btn svg{width:15px;height:15px;flex-shrink:0}.btn:hover{border-color:var(--brand);color:var(--brand-dark)}.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}.btn-danger{color:var(--danger);border-color:var(--danger-tint)}.btn-danger:hover{background:var(--danger-tint);border-color:var(--danger)}.btn-ghost{border-color:transparent;background:transparent}.btn-ghost:hover{background:var(--line-2)}.btn-sm{padding:6px 10px;font-size:12.5px}.btn-icon{padding:8px}.btn:disabled{opacity:.4;cursor:not-allowed}
  .field-row{display:flex;gap:8px;align-items:flex-end}.field-row .field{flex:1}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:12.5px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);width:100%;transition:.15s}.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);background:#fff}

function openExport(printNow){const doctorId=state.reportFilters.doctorId;if(!doctorId){toast('اختر الطبيب أولًا');return}if(state.settings.carryoverMode==='manual'){const v=prompt('أدخل الرصيد المرحّل من الفواتير السابقة لهذا الطبيب (اكتب 0 إذا لا يوجد)','0');if(v===null)return;state.reportFilters.openingBalance=Number(v)||0}else{state.reportFilters.openingBalance=autoOpeningBalance(doctorId,state.reportFilters.from)}const w=window.open('','_blank');if(!w){toast('اسمح بفتح النوافذ المنبثقة');return}w.document.open();w.document.write(makeExportHTML());w.document.close();if(printNow){w.onload=()=>setTimeout(()=>w.print(),250)}}async function editLastInvoiceDiscount(){const doctorId=state.reportFilters.doctorId;if(!doctorId){toast('اختر الطبيب أولًا');return}const inv=lastInvoiceFor(doctorId,null);if(!inv){toast('لا توجد فاتورة محفوظة لهذا الطبيب');return}let v=prompt('أدخل قيمة الخصم الجديد على الفاتورة (اكتب 0 لإلغاء الخصم)',String(Number(inv.invoiceDiscount||0)));if(v===null)return;let discount=Number(v);if(!isFinite(discount)||discount<0){toast('قيمة الخصم غير صحيحة');return}const max=Number(inv.grossTotal||inv.periodTotal||0)+Number(inv.openingBalance||0);discount=Math.min(discount,max);const reason=prompt('اكتب سبب الخصم (اختياري)',String(inv.invoiceDiscountReason||''));if(reason===null)return;inv.invoiceDiscount=discount;inv.invoiceDiscountReason=String(reason||'').trim();inv.showInvoiceDiscountReason=confirm('إظهار سبب الخصم داخل الفاتورة؟');inv.periodTotal=Math.max(0,Number(inv.grossTotal||0)-discount);inv.closingDue=Math.max(0,Number(inv.openingBalance||0)+inv.periodTotal-Number(inv.periodPaid||0));await saveKey('invoices',state.invoices);state.reportFilters.invoiceDiscount=discount;state.reportFilters.invoiceDiscountReason=inv.invoiceDiscountReason;state.reportFilters.showInvoiceDiscountReason=inv.showInvoiceDiscountReason;toast('تم تعديل الخصم — الرصيد الجديد '+fmt(inv.closingDue)+' ج.م');render()}
async function issueInvoice(){const doctorId=state.reportFilters.doctorId;if(!doctorId){toast('اختر الطبيب أولًا');return}const from=state.reportFilters.from,to=state.reportFilters.to;let opening=0;if(state.settings.carryoverMode==='manual'){const v=prompt('أدخل الرصيد المرحّل من الفواتير السابقة لهذا الطبيب (اكتب 0 إذا لا يوجد)','0');if(v===null)return;opening=Number(v)||0}else{opening=autoOpeningBalance(doctorId,from)}const cases=state.cases.filter(c=>c.doctorId===doctorId&&(!from||c.receiveDate>=from)&&(!to||c.receiveDate<=to));const grossTotal=cases.reduce((s,c)=>s+caseTotals(c).total,0);let invoiceDiscount=Number(state.reportFilters.invoiceDiscount||0);if(invoiceDiscount<0)invoiceDiscount=0;if(invoiceDiscount>grossTotal+opening)invoiceDiscount=grossTotal+opening;const invoiceDiscountReason=String(state.reportFilters.invoiceDiscountReason||'').trim();const showInvoiceDiscountReason=state.reportFilters.showInvoiceDiscountReason!==false;const periodTotal=Math.max(0,grossTotal-invoiceDiscount);const amounts=[];state.doctorPayments.filter(p=>p.doctorId===doctorId&&(!from||p.date>=from)&&(!to||p.date<=to)).forEach(p=>amounts.push(Number(p.amount||0)));cases.forEach(c=>(c.payments||[]).forEach(p=>{const date=p.date||c.receiveDate||'—';if((!from||date>=from)&&(!to||date<=to))amounts.push(Number(p.amount||0))}));const periodPaid=amounts.reduce((a,b)=>a+b,0);const closingDue=Math.max(0,opening+periodTotal-periodPaid);state.invoices.push({id:'inv_'+Date.now(),doctorId,from:from||'',to:to||'',issuedAt:new Date().toISOString(),openingBalance:opening,grossTotal,invoiceDiscount,invoiceDiscountReason,showInvoiceDiscountReason,periodTotal,periodPaid,closingDue});await saveKey('invoices',state.invoices);state.reportFilters.openingBalance=opening;toast('تم حفظ الفاتورة — تم احتساب الخصم '+fmt(invoiceDiscount)+' ج.م ورصيد '+fmt(closingDue)+' ج.م سيظهر تلقائيًا في الفاتورة القادمة')}

function nav(){return`<button id="nav-toggle" class="nav-toggle-btn" title="إخفاء/إظهار الشريط">${icon(state.navHidden?'chevronUp':'chevronDown')}</button><div class="bottom-nav ${state.navHidden?'nav-collapsed':''}">${[['cases','list','الحالات'],['doctors','doc','الأطباء والحسابات'],['prices','money','الأسعار'],['export','file','التصدير'],['settings','gear','الإعدادات']].map(x=>`<button class="nav-btn ${state.tab===x[0]?'active':''}" data-tab="${x[0]}"><span class="nav-icon-wrap">${icon(x[1])}</span><span>${x[2]}</span></button>`).join('')}</div>`}
function casesTab(){if(state.caseView==='form')return caseForm();if(state.statementDoctorId)return statementTab();let list=state.cases.slice().sort((a,b)=>b.createdAt-a.createdAt);let total=state.cases.reduce((s,c)=>s+caseTotals(c).total,0),casePaid=state.cases.reduce((s,c)=>s+caseTotals(c).paid,0),doctorPaid=state.doctorPayments.reduce((s,p)=>s+Number(p.amount||0),0),due=Math.max(0,total-casePaid-doctorPaid);return`<div class="panel"><button class="btn btn-primary" id="open-statement-picker">${icon('search')} البحث عن حالة</button>${state.statementPickerOpen?`<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>اختر الطبيب</th></tr></thead><tbody>${state.doctors.length?state.doctors.map(d=>`<tr><td data-pick-statement="${d.id}" style="cursor:pointer">${esc(d.name)}</td></tr>`).join(''):'<tr class="empty-row"><td>لا يوجد أطباء مسجلين</td></tr>'}</tbody></table></div>`:''}</div><div class="stat-lines"><div class="stat-line"><span>عدد الحالات</span><b>${state.cases.length}</b></div><div class="stat-line"><span>إجمالي المستحقات</span><b>${fmt(total)} ج.م</b></div><div class="stat-line"><span>المتبقي غير المحصل</span><b style="color:var(--danger)">${fmt(due)} ج.م</b></div></div><div class="panel"><div class="panel-head"><button class="btn btn-primary" id="new-case">${icon('plus')} حالة جديدة</button><div><h2>سجل الحالات</h2><div class="sub">كل الحالات المسجلة في المعمل</div></div></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>اسم الحالة</th><th>نوع الحالة</th><th>الكمية</th><th>اللون</th><th>سعر الوحدة</th><th>الإجمالي</th><th></th></tr></thead><tbody>${list.length?list.map(c=>(c.items&&c.items.length?c.items:[{}]).map((i,idx)=>{const type=state.priceList.find(p=>p.id===i.restorationId)?.name||'—';const lineTotal=(Number(i.qty)||0)*(Number(i.price)||0);return `<tr><td>${idx===0?(c.receiveDate||'—'):''}</td><td>${esc(i.itemName||'—')}</td><td>${esc(type)}</td><td>${fmt(i.qty||1)}</td><td>${esc(i.color||'—')}</td><td>${fmt(i.price||0)} ج.م</td><td>${fmt(lineTotal)} ج.م</td><td>${idx===0?`<button class="btn btn-ghost btn-sm" data-edit="${c.id}">${icon('edit')}</button><button class="btn btn-ghost btn-sm btn-danger" data-del="${c.id}">${icon('trash')}</button>`:''}</td></tr>`}).join('')).join(''):'<tr class="empty-row"><td colspan="8">لا توجد حالات بعد</td></tr>'}</tbody></table></div></div>`}
function caseForm(){let c=state.currentCase,t=caseTotals(c);let recentWeekHTML='';if(state.showRecentWeek){const weekAgo=new Date(Date.now()-7*24*60*60*1000).toISOString().slice(0,10);const recent=state.cases.filter(rc=>(rc.receiveDate||'')>=weekAgo).sort((a,b)=>String(b.receiveDate||'').localeCompare(String(a.receiveDate||'')));const cards=recent.map(rc=>{const items=(rc.items||[]).map(i=>{const type=state.priceList.find(p=>p.id===i.restorationId)?.name||'—';return `<tr><td>${esc(rc.receiveDate||'—')}</td><td>${esc(i.itemName||'—')}</td><td>${esc(type)}</td><td>${esc(i.color||'—')}</td><td>${fmt(i.qty||1)}</td><td>${fmt(i.price)} ج.م</td></tr>`}).join('')||'<tr><td colspan="6">لا توجد أصناف</td></tr>';return `<div class="search-case-card"><div class="search-case-head"><span>د. ${esc(doctorName(rc.doctorId))}</span></div><table><thead><tr><th>التاريخ</th><th>اسم الحالة</th><th>نوع التركيبة</th><th>اللون</th><th>الكمية</th><th>سعر الوحدة</th></tr></thead><tbody>${items}</tbody></table></div>`}).join('')||'<div class="empty-state">لا توجد حالات مسجلة خلال آخر أسبوع</div>';recentWeekHTML=`<div class="panel"><h3>حالات آخر أسبوع</h3>${cards}</div>`}return`<div class="panel"><div class="panel-head"><button class="btn btn-ghost btn-sm" id="back">${icon('back')} رجوع</button><h2>${state.editingCaseId?'تعديل حالة':'حالة جديدة'}</h2><button class="btn btn-primary" id="save-case" style="display:none" aria-hidden="true" tabindex="-1">${icon('save')} حفظ الحالة</button></div><button class="btn" id="toggle-recent-week" style="margin-bottom:14px">${icon('list')} حالات آخر أسبوع</button>${recentWeekHTML}<div class="grid-2"><div class="field"><label>الطبيب المعالج</label><select id="doctor"><option value="">اختر الطبيب</option>${state.doctors.map(d=>`<option value="${d.id}" ${c.doctorId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input type="date" id="date" value="${c.receiveDate||''}"></div></div><div class="table-wrap"><table><thead><tr><th>اسم الحالة</th><th>نوع التركيبة</th><th>اللون</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th></th></tr></thead><tbody>${c.items.length?c.items.map(it=>`<tr><td><input data-f="itemName" data-id="${it.id}" value="${esc(it.itemName)}"></td><td><button type="button" class="btn" data-pick-type="${it.id}" style="width:100%;min-width:110px;text-align:right;padding:9px 10px;font-weight:600">${esc((state.priceList.find(p=>p.id===it.restorationId)||{}).name||'اختر النوع')} ▾</button></td><td><select data-f="color" data-id="${it.id}"><option value="">اختر اللون</option>${SHADE_3D_MASTER.map(sh=>`<option value="${sh}" ${it.color===sh?'selected':''}>${sh}</option>`).join('')}<option value="__custom__" ${it.color && !SHADE_3D_MASTER.includes(it.color)?'selected':''}>لون مخصص...</option></select>${it.color && !SHADE_3D_MASTER.includes(it.color)?`<input data-custom-color="${it.id}" value="${esc(it.color)}" placeholder="اكتب اللون" style="margin-top:4px">`:''}</td><td><select data-f="qty" data-id="${it.id}">${Array.from({length:16},(_,i)=>i+1).map(n=>`<option ${Number(it.qty)===n?'selected':''}>${n}</option>`).join('')}</select></td><td><strong>${fmt(it.price)}</strong></td><td><strong>${fmt((Number(it.price)||0)*(Number(it.qty)||1))}</strong></td><td><button class="btn btn-ghost btn-sm btn-danger" data-rem-item="${it.id}">${icon('trash')}</button></td></tr>`).join(''):'<tr class="empty-row"><td colspan="7">اضغط إضافة صنف لبدء إضافة التركيبات</td></tr>'}</tbody></table></div><button class="btn btn-sm" id="add-item" style="margin-top:10px">${icon('plus')} إضافة صنف</button> <button class="btn btn-primary btn-sm" id="save-case-inline-2" style="margin-top:10px">${icon('save')} حفظ</button><div class="grid-2" style="margin-top:14px"><div class="field"><label>خصم</label><input type="number" min="0" id="discount" value="${c.discount||0}"><label style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;font-weight:400"><input t function __pdfDlMain(cfg){
  var btn=document.getElementById('direct-pdf-btn');if(!btn)return;
  var orig=btn.textContent;
  function saveBlob(blob,name,mime,kind){
    function fb(){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}
    var B=window.AndroidDownloader||(window.opener&&window.opener.AndroidDownloader);
    if(B){var r=new FileReader();r.onloadend=function(){try{B.saveBase64File(String(r.result).split(',')[1],name,mime,kind||'')}catch(e){fb()}};r.onerror=fb;r.readAsDataURL(blob);return}
    fb()
  }
  function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
  function libs(){return Promise.resolve().then(function(){if(!window.html2canvas)return loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')}).then(function(){if(!window.jspdf)return loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')})}
  function prog(t){btn.textContent=t}
  function jpg(canvas,y0,y1,q){var sy=Math.max(0,Math.round(y0));var sh=Math.max(1,Math.min(Math.round(y1-y0),canvas.height-sy));var c=document.createElement('canvas');c.width=canvas.width;c.height=sh;var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);return c.toDataURL('image/jpeg',q)}
  function rel(n,er){var r=n.getBoundingClientRect();return{t:r.top-er.top,b:r.bottom-er.top}}

  // one invoice (.invoice) -> A4 pages, rows are never cut in half
  function addInvoice(pdf,el,canvas,newPage,q){
    var er=el.getBoundingClientRect();var ratio=canvas.width/er.width;var k=er.width/210;
    var cands=[],rowsInfo=[];
    Array.prototype.forEach.call(el.children,function(c){if(c.tagName==='TABLE'||c.classList.contains('payment-log')||c.classList.contains('section-title')||c.classList.contains('bottom'))return;cands.push(rel(c,er).b)});
    Array.prototype.forEach.call(el.querySelectorAll('tbody tr'),function(tr){var r=rel(tr,er);var nx=tr.nextElementSibling;var glued=nx&&(nx.classList.contains('discount-row')||nx.classList.contains('notes-row'));rowsInfo.push({t:r.t,b:r.b,table:tr.closest('table')});if(!glued)cands.push(r.b)});
    cands.sort(function(a,b){return a-b});
    var totalH=er.height,start=0,page=0,topM=10,botM=8,guard=0;
    while(start<totalH-1&&guard<60){
      guard++;var ctx=null,hdr=null,hdrH=0;
      if(page>0){for(var q2=0;q2<rowsInfo.length;q2++){if(rowsInfo[q2].t>=start-3&&rowsInfo[q2].t<=start+4){ctx=rowsInfo[q2].table;break}}}
      if(ctx){var th=ctx.querySelector('thead');if(th){hdr=rel(th,er);hdrH=hdr.b-hdr.t}}
      var off=page===0?0:topM;var limit=start+(297-off-botM)*k-hdrH;var end;
      if(totalH<=limit+1){end=totalH}else{end=-1;for(var i=cands.length-1;i>=0;i--){if(cands[i]<=limit&&cands[i]>start+40){end=cands[i];break}}if(end<0)end=limit}
      if(page>0||newPage)pdf.addPage();
      var y=off;
      if(hdr){pdf.addImage(jpg(canvas,hdr.t*ratio,hdr.b*ratio,q),'JPEG',0,y,210,hdrH/k);y+=hdrH/k}
      pdf.addImage(jpg(canvas,start*ratio,end*ratio,q),'JPEG',0,y,210,(end-start)/k);
      start=end;page++;
    }
  }

  function doInvoices(pdf){
    var els=Array.prototype.slice.call(document.querySelectorAll('.invoice'));
    if(!els.length)return Promise.reject(new Error('no invoices'));
    var chain=Promise.resolve(),first=true;
    els.forEach(function(el,idx){chain=chain.then(function(){
      prog('جاري تجهيز الفاتورة '+(idx+1)+'/'+els.length+'...');
      els.forEach(function(o){o.parentNode.style.display=(o===el?'':'none')});
      window.scrollTo(0,0);
      var old={width:el.style.width,maxWidth:el.style.maxWidth,minHeight:el.style.minHeight,margin:el.style.margin,padding:el.style.padding,overflow:el.style.overflow};
      var oldBody=document.body.style.overflowX;
      /* Keep mobile preview responsive, but render the PDF at a stable A4 CSS width. */
      el.style.width='794px';el.style.maxWidth='794px';el.style.minHeight='auto';el.style.margin='0';el.style.padding='28px 30px 30px';el.style.overflow='visible';document.body.style.overflowX='visible';
      return window.html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:794,scrollX:0,scrollY:0}).then(function(canvas){
        addInvoice(pdf,el,canvas,!first,els.length>1?0.88:0.95);first=false;
      }).finally(function(){
        el.style.width=old.width;el.style.maxWidth=old.maxWidth;el.style.minHeight=old.minHeight;el.style.margin=old.margin;el.style.padding=old.padding;el.style.overflow=old.overflow;document.body.style.overflowX=oldBody;
      });
    })});
    return chain.then(function(){els.forEach(function(o){o.parentNode.style.display=''})},function(e){els.forEach(function(o){o.parentNode.style.display=''});throw e});
  }

  // full backup (.page): measured at a fixed desktop width, cut only between blocks
  function doPage(pdf){
    var src=document.querySelector('.page');if(!src)return Promise.reject(new Error('no page'));
    window.scrollTo(0,0);
    var stage=document.createElement('div');stage.id='pdf-stage';
    stage.style.cssText='position:absolute;left:0;top:0;width:1000px;background:#fff;z-index:998';
    var inner=src.cloneNode(true);inner.style.maxWidth='none';inner.style.margin='0';inner.style.border='0';
    stage.appendChild(inner);document.body.appendChild(stage);
    var er=stage.getBoundingClientRect(),k=er.width/210,totalH=er.height,cands=[];
    Array.prototype.forEach.call(stage.querySelectorAll('.top,.summary,.case,.empty,.payment-table tbody tr,.doctor,.grand'),function(n){cands.push(rel(n,er).b)});
    cands.sort(function(a,b){return a-b});
    var slices=[],start=0,guard=0;
    while(start<totalH-1&&guard<600){guard++;var limit=start+285*k,end;
      if(totalH<=limit+1){end=totalH}else{end=-1;for(var i=cands.length-1;i>=0;i--){if(cands[i]<=limit&&cands[i]>start+60){end=cands[i];break}}if(end<0)end=limit}
      slices.push([start,end]);start=end}
    var chain=Promise.resolve();
    slices.forEach(function(sl,idx){chain=chain.then(function(){
      prog('جاري التجهيز... صفحة '+(idx+1)+'/'+slices.length);
      return window.html2canvas(stage,{scale:1.5,useCORS:true,backgroundColor:'#ffffff',y:sl[0],height:Math.ceil(sl[1]-sl[0])}).then(function(canvas){
        if(idx>0)pdf.addPage();
        pdf.addImage(canvas.toDataURL('image/jpeg',0.85),'JPEG',0,6,210,210*canvas.height/canvas.width);
      })
    })});
    var done=function(){if(stage.parentNode)stage.parentNode.removeChild(stage)};
    return chain.then(done,function(e){done();throw e});
  }

  btn.onclick=function(){
    btn.disabled=true;prog('جاري التجهيز...');
    libs().then(function(){
      var pdf=new window.jspdf.jsPDF('p','mm','a4');
      return (cfg.mode==='invoices'?doInvoices(pdf):doPage(pdf)).then(function(){
        saveBlob(pdf.output('blob'),cfg.name+'-'+new Date().toISOString().slice(0,10)+'.pdf','application/pdf',cfg.mode==='invoices'?'invoice':'backup');
        btn.textContent=orig;btn.disabled=false;
      });
    }).catch(function(e){
      btn.textContent='تعذّر التنزيل — تأكد من الاتصال بالإنترنت وحاول تاني';btn.disabled=false;
      setTimeout(function(){btn.textContent=orig},5000);
    });
  };
}

function incompleteCaseWarning(){
  if(!state.currentCase || !state.incompleteCaseGuard)return true;
  const missing=[];
  if(!state.currentCase.doctorId)missing.push('اختيار الطبيب');
  if(!state.currentCase.id || !state.cases.some(c=>c.id===state.currentCase.id))missing.push('حفظ الحالة');
  const msg='بيانات الحالة ناقصة\n'+(missing.length?'الناقص: '+missing.join(' و ')+'\n':'')+'أدخل كلمة السر للمتابعة واستكمال بيانات الحالة.';
  if(!state.settings.pin){toast('بيانات الحالة ناقصة — أكمل البيانات واحفظ الحالة');return false;}
  const v=prompt(msg+'\nكلمة السر:');
  if(v===state.settings.pin){
    toast('تم السماح لك بالمتابعة — أكمل البيانات الناقصة ثم احفظ الحالة');
    setTimeout(()=>{const d=document.getElementById('doctor');if(d&&!state.currentCase.doctorId)d.focus();else{const first=document.querySelector('[data-f]');if(first)first.focus();}},50);
    return false;
  }
  toast('كلمة السر غير صحيحة');
  return false;
}

function applyTheme(c){
  var css='';
  if(c.brand){css+='--brand:'+c.brand+';--brand-dark:'+c.brand+';'}
  if(c.ink){css+='--ink:'+c.ink+';'}
  if(c.panel){css+='--panel:'+c.panel+';--panel-2:'+c.panel+';'}
  if(c.bg){css+='--bg:'+c.bg+';'}
  var st=document.getElementById('nova-theme-override');
  if(!st){st=document.createElement('style');st.id='nova-theme-override';document.head.appendChild(st)}
  st.textContent=css?':root{'+css+'}':'';
}

  const from=dates.find(x=>/from|start|من/i.test(x.id+x.name+x.placeholder));
  const to=dates.find(x=>/to|end|إلى/i.test(x.id+x.name+x.placeholder));

});

<script id="nova-calculator-v7-js">
(function(){
  function initCalculator(root){
    if(!root || root.dataset.calcReady) return;
    root.dataset.calcReady="1";
    const display=root.querySelector(".calc-display");
    if(!display) return;
    let expr="";
    const paint=()=>display.value=expr||"0";
    root.addEventListener("click",e=>{
      const b=e.target.closest("[data-calc]");
      if(!b) return;
      const v=b.dataset.calc;
      if(v==="C"){expr="";paint();return}
      if(v==="back"){expr=expr.slice(0,-1);paint();return}
      if(v==="="){
        try{
          if(!/^[0-9+\-*/().%\s]+$/.test(expr)) throw 0;
          let s=expr.replace(/%/g,"/100");
          let result=Function('"use strict";return ('+s+')')();
          if(!Number.isFinite(result)) throw 0;
          expr=String(Math.round(result*100000000)/100000000);
        }catch{expr="خطأ"}
        paint(); return;
      }
      if(expr==="خطأ") expr="";
      expr += v;
      paint();
    });
    paint();
  }
  window.initNovaCalculator=initCalculator;
  document.querySelectorAll(".calculator-panel").forEach(initCalculator);
})();
</script>
